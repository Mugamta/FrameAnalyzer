<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<title>프레임 분석기</title>
<style>
:root{--bg:#0f0f12;--panel:#18181d;--line:#2a2a33;--fg:#ddd;--muted:#8a8a96;--bar:#5a6274;--cut:#f6a447;--ins:#ff4f8b;--head:#fff;--thr:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px system-ui,"Malgun Gothic",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
button,select,input{font:inherit;color:var(--fg)}
button{background:#2a2a33;border:1px solid #393945;border-radius:4px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:#34343f}
button:disabled{opacity:.45;cursor:default}
button.on{background:#7a4512;border-color:var(--cut);color:#fff}
button.primary{background:#7a4512;border-color:var(--cut);color:#fff}
select,input[type=number],input[type=text]{background:#22222a;border:1px solid #393945;border-radius:4px;padding:4px 6px}
input[type=range]{width:120px;accent-color:var(--cut)}
label{display:flex;gap:5px;align-items:center;color:var(--muted)}
label b{color:var(--fg);font-weight:normal;font-variant-numeric:tabular-nums}
.sep{width:1px;height:20px;background:var(--line)}
#top{display:flex;gap:8px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#url{flex:1;min-width:120px}
#title{max-width:32%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
#title a{color:var(--muted)}
#main{flex:1;min-height:0;display:flex}
#stage{flex:1;min-width:0;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;object-fit:contain;display:block}
#drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:16px;text-align:center;padding:20px}
#drop.hidden{display:none}
#drop small{font-size:12px;line-height:1.7}
#dragover{position:absolute;inset:0;border:3px dashed var(--cut);background:rgba(246,164,71,.08);display:none;align-items:center;justify-content:center;font-size:20px;pointer-events:none;z-index:5}
body.dragging #dragover{display:flex}
#busy{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:4;padding:20px;text-align:center}
#busy.show{display:flex}
#busy .msg{font-size:15px;white-space:pre-wrap;max-width:720px}
#busy .msg.err{color:#ff8b8e;font-size:13px;text-align:left;font-family:Consolas,monospace;max-height:50vh;overflow:auto}
#busy .bar{width:min(420px,80%);height:6px;background:#2a2a33;border-radius:3px;overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:var(--cut);transition:width .2s}
#badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);padding:4px 8px;border-radius:4px;font-variant-numeric:tabular-nums;pointer-events:none;display:none}
#badge.ins{background:rgba(255,79,139,.85);color:#fff}
#badge.cut{background:rgba(246,164,71,.85);color:#111}
#side{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#side.hidden{display:none}
#side h3{margin:0;padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:normal}
#side h3 b{color:var(--fg);font-weight:normal}
#filters{display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line)}
#events{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
#events li{padding:6px 8px;cursor:pointer;border-bottom:1px solid #202027;border-left:3px solid transparent}
#events li:hover{background:#22222a}
#events li.cur{background:#2c2418}
#events li.cut{border-left-color:var(--cut)}
#events li.ins{border-left-color:var(--ins)}
#events .hd{display:flex;gap:6px;align-items:baseline;margin-bottom:4px;font-variant-numeric:tabular-nums}
#events .hd .k{font-weight:600}
#events li.cut .k{color:var(--cut)}
#events li.ins .k{color:var(--ins)}
#events .hd .t{color:var(--muted);margin-left:auto;font-size:12px}
#events .th{display:flex;gap:3px;align-items:center}
#events .th canvas{flex:1 1 0;min-width:0;max-width:120px;height:64px;object-fit:contain;background:#000;border-radius:2px}
#events .th canvas.mid{outline:2px solid var(--ins)}
#events .th .ar{color:var(--muted);font-size:11px}
#events .empty{padding:14px 10px;color:var(--muted);cursor:default;line-height:1.6}
#recent{border-top:1px solid var(--line);max-height:28%;overflow:auto}
#recent div{padding:5px 10px;cursor:pointer;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--muted)}
#recent div:hover{background:#22222a;color:var(--fg)}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px}
#strip{display:flex;gap:4px;justify-content:center;height:78px}
#strip .f{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums}
#strip canvas{height:62px;background:#000;border-radius:3px;border:2px solid transparent}
#strip .f.cur canvas{border-color:#fff}
#strip .f.cur{color:#fff}
#strip .f.cut canvas{border-color:var(--cut)}
#strip .f.ins canvas{border-color:var(--ins)}
#strip .f.cur.cut canvas,#strip .f.cur.ins canvas{box-shadow:0 0 0 2px #fff}
canvas.graph{width:100%;display:block;border-radius:4px;touch-action:none}
#detail{height:110px;cursor:crosshair}
#overview{height:40px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
#time{font-variant-numeric:tabular-nums;min-width:240px}
.help{color:var(--muted);font-size:12px;margin-left:auto}
kbd{background:#2a2a33;border:1px solid #393945;border-radius:3px;padding:0 4px;font:11px Consolas,monospace}
body.full #side,body.full #panel,body.full #top{display:none}
</style>
</head>
<body>
<div id="top">
  <input id="url" type="text" placeholder="인스타그램 / 유튜브 숏츠 / 트위터(X) / 틱톡 링크를 붙여넣고 Enter" autocomplete="off" spellcheck="false">
  <button id="go" class="primary">분석</button>
  <button id="open">파일 열기</button>
  <input id="file" type="file" accept="video/*,.mkv,.mov,.webm,.mp4" hidden>
  <div id="title"></div>
</div>
<div id="main">
  <div id="stage">
    <video id="video" playsinline preload="auto"></video>
    <div id="badge"></div>
    <div id="drop">
      <div>영상 링크를 위에 붙여넣거나, 영상 파일을 여기에 드래그앤드롭하세요</div>
      <small>모든 프레임을 디코딩해서 이전 프레임과 크게 달라지는 지점(장면 전환)과<br>
      잠깐 끼워 넣은 컷(1~3프레임)을 찾아냅니다.<br>
      아무 곳에서나 <kbd>Ctrl</kbd>+<kbd>V</kbd>로 링크를 붙여넣어도 됩니다.</small>
    </div>
    <div id="busy"><div class="msg"></div><div class="bar"><i></i></div><button id="busyClose" hidden>닫기</button></div>
    <div id="dragover">여기에 놓기</div>
  </div>
  <div id="side">
    <h3><span>감지된 지점 <b id="evCount">0</b></span><button id="exportBtn" title="목록을 텍스트로 복사">복사</button></h3>
    <div id="filters">
      <label><input type="checkbox" id="fCut" checked> <span style="color:var(--cut)">장면 전환</span></label>
      <label><input type="checkbox" id="fIns" checked> <span style="color:var(--ins)">숨은 컷</span></label>
    </div>
    <ul id="events"><li class="empty">아직 분석한 영상이 없습니다.</li></ul>
    <div id="recent"></div>
  </div>
</div>
<div id="panel">
  <div id="strip"></div>
  <canvas id="detail" class="graph"></canvas>
  <canvas id="overview" class="graph"></canvas>
  <div class="row">
    <button id="play" title="재생/정지 (Space)">▶</button>
    <button id="prevF" title="1프레임 뒤로 (← 또는 ,)">◀ 1f</button>
    <button id="nextF" title="1프레임 앞으로 (→ 또는 .)">1f ▶</button>
    <button id="prevE" title="이전 감지 지점 (B)">⏮ 이전 지점</button>
    <button id="nextE" title="다음 감지 지점 (N)">다음 지점 ⏭</button>
    <span id="time">-</span>
    <div class="sep"></div>
    <label title="높을수록 작은 변화도 잡습니다">민감도 <input type="range" id="sens" min="1" max="10" step="1" value="5"> <b id="sensV">5</b></label>
    <label>속도 <select id="rate"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
    <button id="mute" title="음소거 (M)">🔇</button>
    <button id="snap" title="현재 프레임을 PNG로 저장 (S)">프레임 저장</button>
    <span class="help"><kbd>←</kbd><kbd>→</kbd> 프레임 · <kbd>Shift</kbd>+화살표 10프레임 · <kbd>B</kbd><kbd>N</kbd> 지점 이동 · <kbd>H</kbd> 전체화면</span>
  </div>
</div>

<script>
'use strict';
const $ = id => document.getElementById(id);
const video = $('video');
const LS_KEY = 'frameAnalyzer.v1';
const settings = Object.assign({sens: 5, fCut: true, fIns: true, rate: '1', muted: true, recent: []}, loadSettings());
function loadSettings(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } }
function saveSettings(){ try { localStorage.setItem(LS_KEY, JSON.stringify(settings)); } catch {} }

let A = null;          // 서버 분석 결과
let score = null;      // 프레임별 변화 점수 (0~1)
let maxScore = 0.1;
let events = [];       // {type:'cut'|'ins', at, len, score}
let eventOf = null;    // 프레임 → 이벤트 index (-1 없음)
let endOf = null;
let cur = 0;           // 현재 프레임
let view = {start: 0, len: 150, follow: true};
let seekTarget = -1;

// ------------------------------------------------------------ 불러오기
let pollTimer = null, jobToken = 0;
function showBusy(msg, prog, isErr){
  const b = $('busy');
  b.classList.add('show');
  const m = b.querySelector('.msg');
  m.textContent = msg;
  m.classList.toggle('err', !!isErr);
  b.querySelector('.bar').style.display = isErr ? 'none' : '';
  b.querySelector('.bar i').style.width = Math.round((prog || 0) * 100) + '%';
  $('busyClose').hidden = !isErr;
}
function hideBusy(){ $('busy').classList.remove('show'); }
$('busyClose').onclick = hideBusy;

async function analyzeUrl(url, force){
  url = (url || '').trim();
  if (!/^https?:\/\//i.test(url)) { showBusy('http:// 또는 https:// 로 시작하는 링크를 넣어주세요.', 0, true); return; }
  $('url').value = url;
  showBusy('요청 중…', 0);
  try {
    const r = await fetch('/api/url', {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({url, force: !!force})});
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    poll(j.id);
  } catch (e) { serverError(e); }
}

function analyzeFile(file){
  if (!file) return;
  const token = ++jobToken;
  showBusy(`업로드 중 (이 컴퓨터 안에서만 처리됩니다) — ${file.name}`, 0);
  const xhr = new XMLHttpRequest();
  xhr.open('POST', '/api/upload');
  xhr.setRequestHeader('X-Filename', encodeURIComponent(file.name));
  xhr.upload.onprogress = e => { if (token === jobToken && e.lengthComputable) showBusy(`업로드 중 — ${file.name}`, e.loaded / e.total); };
  xhr.onload = () => {
    if (token !== jobToken) return;
    try { const j = JSON.parse(xhr.responseText); if (xhr.status !== 200) throw new Error(j.error); poll(j.id, file.name); }
    catch (e) { serverError(e); }
  };
  xhr.onerror = () => serverError(new Error('업로드 실패'));
  xhr.send(file);
}

function serverError(e){
  const msg = String(e && e.message || e);
  if (/Failed to fetch|NetworkError|업로드 실패/.test(msg))
    showBusy('로컬 서버에 연결할 수 없습니다.\nstart.bat (또는 python server.py) 로 실행했는지 확인하세요.', 0, true);
  else showBusy(msg, 0, true);
}

const STATE_LABEL = {queued: '대기 중', download: '다운로드', transcode: '변환', analyze: '프레임 분석'};
function poll(id){
  const token = ++jobToken;
  clearTimeout(pollTimer);
  const tick = async () => {
    if (token !== jobToken) return;
    try {
      const r = await fetch('/api/job?id=' + id);
      const j = await r.json();
      if (token !== jobToken) return;
      if (j.state === 'done') { hideBusy(); load(j.result); return; }
      if (j.state === 'error') { showBusy(friendlyError(j.message), 0, true); return; }
      showBusy(`${STATE_LABEL[j.state] || j.state}\n${j.message || ''}`, j.progress);
    } catch (e) { serverError(e); return; }
    pollTimer = setTimeout(tick, 350);
  };
  tick();
}

function friendlyError(msg){
  msg = msg || '알 수 없는 오류';
  let hint = '';
  if (/login|cookie|sign in|rate-limit|private|authentication/i.test(msg))
    hint = '\n\n→ 로그인이 필요한 게시물일 수 있습니다. README의 "쿠키 설정"을 참고하세요.';
  else if (/Unsupported URL/i.test(msg)) hint = '\n\n→ 지원하지 않는 링크입니다.';
  else if (/HTTP Error|Unable to extract|extractor/i.test(msg))
    hint = '\n\n→ 사이트가 바뀌었을 수 있습니다. update.bat 으로 yt-dlp를 업데이트해 보세요.';
  return '분석 실패\n\n' + msg + hint;
}

function load(res){
  A = res;
  A.pts = Float64Array.from(A.pts);
  for (const k of ['d', 'h', 's1', 's2', 's3']) A[k] = Float32Array.from(A[k]);
  score = new Float32Array(A.n);
  for (let i = 0; i < A.n; i++) score[i] = (A.d[i] + A.h[i]) / 2;
  let mx = 0; for (let i = 1; i < A.n; i++) if (score[i] > mx) mx = score[i];
  maxScore = Math.max(0.05, mx);
  thumbs.clear(); thumbQueue.length = 0;
  cur = 0; view = {start: 0, len: Math.min(150, A.n), follow: true};
  $('drop').classList.add('hidden');
  const t = $('title'); t.textContent = '';
  if (/^https?:/.test(A.source || '')) {
    const a = document.createElement('a'); a.href = A.source; a.target = '_blank'; a.rel = 'noreferrer';
    a.textContent = (A.extractor ? `[${A.extractor}] ` : '') + (A.title || A.source); t.appendChild(a);
  } else t.textContent = A.title || '';
  t.title = t.textContent;
  video.src = A.video;
  thumbVideo.src = A.video;
  video.playbackRate = +settings.rate;
  addRecent(A);
  detect();
  seekFrame(0);
}

function addRecent(r){
  settings.recent = [{id: r.id, title: r.title || r.source || r.id}].concat(settings.recent.filter(x => x.id !== r.id)).slice(0, 15);
  saveSettings(); renderRecent();
}
function renderRecent(){
  const box = $('recent'); box.innerHTML = '';
  if (!settings.recent.length) return;
  const h = document.createElement('h3'); h.innerHTML = '<span>최근 분석</span>'; box.appendChild(h);
  for (const r of settings.recent) {
    const d = document.createElement('div'); d.textContent = r.title; d.title = r.title;
    d.onclick = () => { showBusy('불러오는 중…', 0); poll(r.id); };
    box.appendChild(d);
  }
}

// ------------------------------------------------------------ 감지
function median(arr){ const a = arr.slice().sort((x, y) => x - y); return a.length ? a[a.length >> 1] : 0; }
function detect(){
  if (!A) return;
  const n = A.n, s = settings.sens, t = (s - 1) / 9;
  const minAbs = 0.22 - 0.18 * t;     // 절대 기준: 0.22 (둔감) ~ 0.04 (민감)
  const ratio = 7 - 4.5 * t;          // 주변 평균 대비 배수: 7 ~ 2.5
  detect.minAbs = minAbs;
  const peak = new Uint8Array(n), base = new Float32Array(n);
  const W = 12;
  for (let i = 1; i < n; i++) {
    const win = [];
    for (let j = Math.max(1, i - W); j <= Math.min(n - 1, i + W); j++) if (Math.abs(j - i) > 1) win.push(score[j]);
    base[i] = median(win);
    if (score[i] >= minAbs && score[i] >= ratio * (base[i] + 0.004)) peak[i] = 1;
  }
  detect.base = base;
  events = [];
  const used = new Uint8Array(n);
  const skip = [null, A.s1, A.s2, A.s3];
  for (let i = 1; i < n; i++) {
    if (!peak[i] || used[i]) continue;
    // 숨은 컷: i 에서 갈라졌다가 i+k 에서 원래 장면으로 돌아오는가?
    let found = 0;
    for (let k = 1; k <= 3 && i + k < n; k++) {
      const back = A.d[i + k], sk = skip[k][i];
      if (sk < 0) continue;
      const big = Math.min(A.d[i], back);
      if (back >= minAbs * 0.6 && sk <= big * 0.35 && sk < minAbs) { found = k; break; }
    }
    if (found) {
      events.push({type: 'ins', at: i, len: found, score: score[i]});
      for (let j = i; j <= i + found; j++) used[j] = 1;
    } else {
      events.push({type: 'cut', at: i, len: 0, score: score[i]});
      used[i] = 1;
    }
  }
  eventOf = new Int32Array(n).fill(-1);
  endOf = new Int32Array(n).fill(-1);   // 숨은 컷이 끝나고 원래 장면으로 돌아오는 프레임
  events.forEach((e, k) => {
    for (let j = e.at; j <= e.at + Math.max(0, e.len - 1); j++) eventOf[j] = k;
    if (e.type === 'ins' && e.at + e.len < n) endOf[e.at + e.len] = k;
  });
  renderEvents();
  drawAll();
}

function visibleEvents(){ return events.filter(e => e.type === 'cut' ? settings.fCut : settings.fIns); }

// ------------------------------------------------------------ 이벤트 목록
let listObserver = null;
function renderEvents(){
  const ul = $('events'); ul.innerHTML = '';
  if (listObserver) listObserver.disconnect();
  const evs = visibleEvents();
  $('evCount').textContent = evs.length;
  if (!A) { ul.innerHTML = '<li class="empty">아직 분석한 영상이 없습니다.</li>'; return; }
  if (!evs.length) { ul.innerHTML = '<li class="empty">감지된 지점이 없습니다.<br>아래 <b>민감도</b>를 올려보세요.</li>'; return; }
  listObserver = new IntersectionObserver(entries => {
    for (const en of entries) if (en.isIntersecting) { fillThumbs(en.target); listObserver.unobserve(en.target); }
  }, {root: ul, rootMargin: '200px'});
  evs.forEach((e, k) => {
    const li = document.createElement('li');
    li.className = e.type;
    li.dataset.idx = events.indexOf(e);
    const kind = e.type === 'ins' ? `숨은 컷 ${e.len}프레임` : '장면 전환';
    li.innerHTML = `<div class="hd"><span>${k + 1}.</span><span class="k">${kind}</span><span>#${e.at}</span>` +
      `<span class="t">${fmtTime(A.pts[e.at])} · ${Math.round(e.score * 100)}%</span></div><div class="th"></div>`;
    const th = li.querySelector('.th');
    const frames = e.type === 'ins' ? [e.at - 1, e.at, e.at + e.len] : [e.at - 1, e.at];
    frames.forEach((f, j) => {
      if (j) { const s = document.createElement('span'); s.className = 'ar'; s.textContent = '→'; th.appendChild(s); }
      const c = document.createElement('canvas'); c.dataset.f = f;
      if (e.type === 'ins' && j === 1) c.className = 'mid';
      th.appendChild(c);
    });
    li.onclick = () => { pause(); seekFrame(e.at); };
    ul.appendChild(li);
    listObserver.observe(li);
  });
  markCurrentEvent();
}
function fillThumbs(li){ li.querySelectorAll('canvas[data-f]').forEach(c => thumbInto(c, +c.dataset.f, 0, false)); }

function markCurrentEvent(){
  const k = eventOf ? eventOf[cur] : -1;
  const ul = $('events');
  const prev = ul.querySelector('li.cur');
  if (prev && +prev.dataset.idx === k) return;
  if (prev) prev.classList.remove('cur');
  if (k >= 0) {
    const li = ul.querySelector(`li[data-idx="${k}"]`);
    if (li) { li.classList.add('cur'); li.scrollIntoView({block: 'nearest'}); }
  }
}

$('exportBtn').onclick = () => {
  if (!A) return;
  const lines = [`${A.title || ''}`, A.source || '', `총 ${A.n}프레임, ${A.fps}fps`, ''];
  visibleEvents().forEach((e, k) => lines.push(`${k + 1}. ${fmtTime(A.pts[e.at])}  #${e.at}  ${e.type === 'ins' ? `숨은 컷(${e.len}프레임)` : '장면 전환'}  변화 ${Math.round(e.score * 100)}%`));
  navigator.clipboard.writeText(lines.join('\n')).then(() => { const b = $('exportBtn'); b.textContent = '복사됨'; setTimeout(() => b.textContent = '복사', 1200); });
};

// ------------------------------------------------------------ 썸네일 (숨겨진 두 번째 video)
const thumbVideo = document.createElement('video');
thumbVideo.muted = true; thumbVideo.preload = 'auto'; thumbVideo.playsInline = true;
const thumbs = new Map();       // frame → ImageBitmap/canvas
const thumbQueue = [];          // {f, resolve}
let thumbBusy = false;
const THUMB_H = 120;

function frameTime(i){
  const p = A.pts;
  const next = i + 1 < A.n ? p[i + 1] : p[i] + 1 / A.fps;
  return Math.max(0, p[i] + (next - p[i]) * 0.5);
}

function getThumb(f, priority){
  if (thumbs.has(f)) return Promise.resolve(thumbs.get(f));
  return new Promise(resolve => {
    const job = {f, resolve};
    priority ? thumbQueue.unshift(job) : thumbQueue.push(job);
    runThumbs();
  });
}
async function runThumbs(){
  if (thumbBusy) return;
  thumbBusy = true;
  const src = thumbVideo.src;
  while (thumbQueue.length) {
    const job = thumbQueue.shift();
    if (thumbs.has(job.f)) { job.resolve(thumbs.get(job.f)); continue; }
    try {
      await seekVideo(thumbVideo, frameTime(job.f));
      if (thumbVideo.src !== src) break;
      const w = Math.round(THUMB_H * thumbVideo.videoWidth / thumbVideo.videoHeight) || THUMB_H;
      const c = document.createElement('canvas'); c.width = w; c.height = THUMB_H;
      c.getContext('2d').drawImage(thumbVideo, 0, 0, w, THUMB_H);
      thumbs.set(job.f, c);
      if (thumbs.size > 600) thumbs.delete(thumbs.keys().next().value);
      job.resolve(c);
    } catch { job.resolve(null); }
  }
  thumbBusy = false;
}
function seekVideo(v, t){
  return new Promise((resolve, reject) => {
    const go = () => {
      const done = () => { v.removeEventListener('seeked', done); v.removeEventListener('error', fail);
        if (v.requestVideoFrameCallback) { let ok = false; v.requestVideoFrameCallback(() => { ok = true; resolve(); }); setTimeout(() => ok || resolve(), 120); } else resolve(); };
      const fail = () => { v.removeEventListener('seeked', done); reject(); };
      v.addEventListener('seeked', done); v.addEventListener('error', fail);
      v.currentTime = t;
    };
    if (v.readyState >= 1) go(); else v.addEventListener('loadedmetadata', go, {once: true});
  });
}
async function thumbInto(canvas, f, h, priority){
  if (!A || f < 0 || f >= A.n) { canvas.width = 1; canvas.height = 1; return; }
  canvas.dataset.want = f;
  const img = await getThumb(f, priority);
  if (!img || +canvas.dataset.want !== f) return;
  canvas.width = img.width; canvas.height = img.height;
  if (h) canvas.style.height = h + 'px';
  canvas.getContext('2d').drawImage(img, 0, 0);
}

// ------------------------------------------------------------ 필름스트립 (현재 ±3프레임)
const STRIP = 3;
const stripEls = [];
for (let k = -STRIP; k <= STRIP; k++) {
  const d = document.createElement('div'); d.className = 'f';
  const c = document.createElement('canvas'); c.width = 1; c.height = 1;
  const s = document.createElement('span');
  d.appendChild(c); d.appendChild(s);
  d.onclick = () => { if (d.dataset.f !== undefined && d.dataset.f !== '') { pause(); seekFrame(+d.dataset.f); } };
  $('strip').appendChild(d);
  stripEls.push({d, c, s, k});
}
let stripTimer = null;
function updateStrip(){
  if (!A) return;
  for (const {d, c, s, k} of stripEls) {
    const f = cur + k;
    const ok = f >= 0 && f < A.n;
    d.dataset.f = ok ? f : '';
    d.style.visibility = ok ? '' : 'hidden';
    d.classList.toggle('cur', k === 0);
    const ev = ok && eventOf[f] >= 0 ? events[eventOf[f]] : null;
    d.classList.toggle('cut', !!ev && ev.type === 'cut' && settings.fCut);
    d.classList.toggle('ins', !!ev && ev.type === 'ins' && settings.fIns);
    s.textContent = ok ? `#${f}` + (ok && f > 0 ? ` · ${Math.round(score[f] * 100)}%` : '') : '';
  }
  clearTimeout(stripTimer);
  // 재생 중엔 갱신하지 않고, 멈췄을 때만 썸네일을 그림
  if (!video.paused) return;
  stripTimer = setTimeout(() => {
    const order = stripEls.slice().sort((a, b) => Math.abs(a.k) - Math.abs(b.k));
    for (const {c, k} of order.reverse()) { const f = cur + k; if (f >= 0 && f < A.n) thumbInto(c, f, 62, true); }
  }, 60);
}

// ------------------------------------------------------------ 재생/탐색
function seekFrame(i){
  if (!A) return;
  i = Math.max(0, Math.min(A.n - 1, i));
  cur = i; seekTarget = i;
  if (Math.abs(video.currentTime - frameTime(i)) > 1e-4) video.currentTime = frameTime(i);
  onFrame();
}
function frameAtTime(t){
  const p = A.pts; let lo = 0, hi = A.n - 1;
  while (lo < hi) { const m = (lo + hi + 1) >> 1; if (p[m] <= t + 1e-4) lo = m; else hi = m - 1; }
  return lo;
}
function pause(){ if (!video.paused) video.pause(); }
function togglePlay(){ if (!A) return; video.paused ? video.play() : video.pause(); }

function rvfc(now, meta){
  if (A && !video.paused) { cur = frameAtTime(meta.mediaTime); onFrame(); }
  video.requestVideoFrameCallback(rvfc);
}
if (video.requestVideoFrameCallback) video.requestVideoFrameCallback(rvfc);
else (function loop(){ if (A && !video.paused) { cur = frameAtTime(video.currentTime); onFrame(); } requestAnimationFrame(loop); })();

video.addEventListener('play', () => { $('play').textContent = '⏸'; });
video.addEventListener('pause', () => {
  $('play').textContent = '▶';
  if (A) { cur = frameAtTime(video.currentTime); seekFrame(cur); }
});
video.addEventListener('error', () => {
  if (A) showBusy('브라우저가 이 영상을 재생하지 못했습니다. (코덱: ' + (A.codec || '?') + ')', 0, true);
});

function onFrame(){
  if (!A) return;
  const t = A.pts[cur];
  $('time').textContent = `${fmtTime(t)} / ${fmtTime(A.duration)}   #${cur} / ${A.n - 1}   ${A.fps}fps`;
  const k = eventOf[cur];
  const b = $('badge');
  const ev = k >= 0 ? events[k] : null;
  const show = ev && (ev.type === 'cut' ? settings.fCut : settings.fIns);
  b.style.display = 'block';
  b.className = show ? ev.type : '';
  b.textContent = `#${cur}` + (cur > 0 ? `  변화 ${Math.round(score[cur] * 100)}%` : '') +
    (show ? (ev.type === 'ins' ? `  ● 숨은 컷 (${ev.len}프레임)` : '  ● 장면 전환') : '');
  const outside = cur < view.start || cur >= view.start + view.len;
  const nearEdge = cur < view.start + view.len * 0.1 || cur > view.start + view.len * 0.9;
  if (outside || (view.follow && nearEdge)) {
    view.start = Math.max(0, Math.min(A.n - view.len, Math.round(cur - view.len / 2)));
    view.follow = true;
  }
  drawAll();
  updateStrip();
  markCurrentEvent();
}

function jumpEvent(dir){
  const evs = visibleEvents();
  if (!evs.length) return;
  pause();
  let e;
  if (dir > 0) e = evs.find(x => x.at > cur) || evs[0];
  else e = [...evs].reverse().find(x => x.at < cur) || evs[evs.length - 1];
  seekFrame(e.at);
}

function fmtTime(t){
  if (!isFinite(t)) t = 0;
  const m = Math.floor(t / 60), s = t - m * 60;
  return `${String(m).padStart(2, '0')}:${s.toFixed(3).padStart(6, '0')}`;
}

// ------------------------------------------------------------ 그래프
const detailC = $('detail'), overC = $('overview');
function fit(c){
  const r = c.getBoundingClientRect(), dpr = devicePixelRatio || 1;
  const w = Math.round(r.width * dpr), h = Math.round(r.height * dpr);
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
  return {w, h, dpr};
}
const yOf = (v, h) => h - Math.sqrt(Math.min(1, v / maxScore)) * (h - 14) - 2;
function evColor(e){ return e.type === 'ins' ? '#ff4f8b' : '#f6a447'; }
function evVisible(e){ return e.type === 'cut' ? settings.fCut : settings.fIns; }

function drawDetail(){
  const {w, h, dpr} = fit(detailC), g = detailC.getContext('2d');
  g.fillStyle = '#101014'; g.fillRect(0, 0, w, h);
  if (!A) return;
  const {start, len} = view, bw = w / len;
  // 이벤트 배경
  for (const e of events) {
    if (!evVisible(e) || e.at + Math.max(1, e.len) < start || e.at > start + len) continue;
    g.fillStyle = e.type === 'ins' ? 'rgba(255,79,139,.16)' : 'rgba(246,164,71,.12)';
    g.fillRect((e.at - start) * bw, 0, Math.max(1, e.len || 1) * bw, h);
  }
  // 프레임 눈금
  g.fillStyle = '#6a6a76'; g.font = `${10 * dpr}px system-ui`; g.textBaseline = 'top';
  const stepChoices = [1, 2, 5, 10, 15, 30, 60, 120, 300, 600, 1500, 3000];
  const step = stepChoices.find(s => s * bw >= 46 * dpr) || 6000;
  for (let f = Math.ceil(start / step) * step; f < start + len; f += step) {
    const x = (f - start) * bw;
    g.fillRect(x, 0, 1, 4 * dpr); g.fillText('#' + f, x + 2, 1);
  }
  // 막대
  const base = detect.base;
  for (let f = Math.max(1, Math.floor(start)); f < Math.min(A.n, start + len + 1); f++) {
    const k = eventOf[f] >= 0 ? eventOf[f] : (endOf[f] >= 0 ? endOf[f] : -1), e = k >= 0 ? events[k] : null;
    g.fillStyle = e && evVisible(e) ? evColor(e) : '#5a6274';
    const x = (f - start) * bw, y = yOf(score[f], h);
    g.fillRect(x + (bw > 3 ? 1 : 0), y, Math.max(1, bw - (bw > 3 ? 2 : 0)), h - y);
  }
  // 기준선
  g.strokeStyle = 'rgba(229,72,77,.7)'; g.setLineDash([4 * dpr, 4 * dpr]); g.lineWidth = dpr;
  const ty = yOf(detect.minAbs, h);
  g.beginPath(); g.moveTo(0, ty); g.lineTo(w, ty); g.stroke(); g.setLineDash([]);
  g.fillStyle = 'rgba(229,72,77,.8)'; g.textBaseline = 'bottom'; g.fillText(`기준 ${Math.round(detect.minAbs * 100)}%`, w - 60 * dpr, ty - 1);
  // 현재 프레임
  const x = (cur - start) * bw;
  g.strokeStyle = '#fff'; g.lineWidth = Math.max(1, Math.min(2 * dpr, bw * 0.3));
  if (bw >= 4) g.strokeRect(x + 0.5, 1, bw - 1, h - 2);
  else { g.fillStyle = '#fff'; g.fillRect(x, 0, Math.max(1, dpr), h); }
}

function drawOverview(){
  const {w, h, dpr} = fit(overC), g = overC.getContext('2d');
  g.fillStyle = '#101014'; g.fillRect(0, 0, w, h);
  if (!A) return;
  const n = A.n;
  g.fillStyle = '#4a5060';
  for (let x = 0; x < w; x++) {
    const a = Math.floor(x / w * n), b = Math.max(a + 1, Math.floor((x + 1) / w * n));
    let mx = 0; for (let f = Math.max(1, a); f < b && f < n; f++) if (score[f] > mx) mx = score[f];
    const y = yOf(mx, h); g.fillRect(x, y, 1, h - y);
  }
  for (const e of events) {
    if (!evVisible(e)) continue;
    g.fillStyle = evColor(e);
    g.fillRect(Math.floor(e.at / n * w), 0, Math.max(dpr, 2), h);
  }
  g.fillStyle = 'rgba(255,255,255,.08)'; g.strokeStyle = 'rgba(255,255,255,.35)';
  const vx = view.start / n * w, vw = Math.max(2, view.len / n * w);
  g.fillRect(vx, 0, vw, h); g.strokeRect(vx + .5, .5, vw - 1, h - 1);
  g.fillStyle = '#fff'; g.fillRect(Math.floor(cur / n * w), 0, Math.max(1, dpr), h);
}
let drawPending = false;
function drawAll(){
  if (drawPending) return; drawPending = true;
  requestAnimationFrame(() => { drawPending = false; drawDetail(); drawOverview(); });
}
addEventListener('resize', drawAll);

// 상세 그래프: 클릭 = 이동, 드래그 = 이동(팬), 휠 = 확대/축소
(() => {
  let down = null;
  const frameAtX = ev => { const r = detailC.getBoundingClientRect(); return view.start + (ev.clientX - r.left) / r.width * view.len; };
  detailC.addEventListener('pointerdown', ev => { if (!A) return; down = {x: ev.clientX, start: view.start, moved: false}; detailC.setPointerCapture(ev.pointerId); });
  detailC.addEventListener('pointermove', ev => {
    if (!down) return;
    const r = detailC.getBoundingClientRect(), dx = ev.clientX - down.x;
    if (Math.abs(dx) > 4) down.moved = true;
    if (down.moved) {
      view.follow = false;
      view.start = Math.max(0, Math.min(A.n - view.len, down.start - dx / r.width * view.len));
      detailC.style.cursor = 'grabbing'; drawAll();
    }
  });
  detailC.addEventListener('pointerup', ev => {
    if (!down) return;
    if (!down.moved) { pause(); seekFrame(Math.floor(frameAtX(ev))); }
    down = null; detailC.style.cursor = '';
  });
  detailC.addEventListener('wheel', ev => {
    if (!A) return; ev.preventDefault();
    const f = frameAtX(ev), r = (f - view.start) / view.len;
    view.len = Math.max(20, Math.min(A.n, Math.round(view.len * (ev.deltaY > 0 ? 1.25 : 0.8))));
    view.start = Math.max(0, Math.min(A.n - view.len, f - r * view.len));
    view.follow = false; drawAll();
  }, {passive: false});
})();
(() => {
  let dragging = false;
  const go = ev => { const r = overC.getBoundingClientRect(); seekFrame(Math.floor((ev.clientX - r.left) / r.width * A.n)); };
  overC.addEventListener('pointerdown', ev => { if (!A) return; dragging = true; overC.setPointerCapture(ev.pointerId); pause(); view.follow = true; go(ev); });
  overC.addEventListener('pointermove', ev => { if (dragging) go(ev); });
  overC.addEventListener('pointerup', () => dragging = false);
})();

// ------------------------------------------------------------ 컨트롤
$('play').onclick = togglePlay;
$('prevF').onclick = () => { pause(); seekFrame(cur - 1); };
$('nextF').onclick = () => { pause(); seekFrame(cur + 1); };
$('prevE').onclick = () => jumpEvent(-1);
$('nextE').onclick = () => jumpEvent(1);
$('go').onclick = () => analyzeUrl($('url').value);
$('url').addEventListener('keydown', e => { if (e.key === 'Enter') analyzeUrl($('url').value, e.shiftKey); });
$('open').onclick = () => $('file').click();
$('file').onchange = e => { analyzeFile(e.target.files[0]); e.target.value = ''; };
$('sens').value = settings.sens; $('sensV').textContent = settings.sens;
$('sens').oninput = e => { settings.sens = +e.target.value; $('sensV').textContent = settings.sens; saveSettings(); detect(); onFrame(); };
$('fCut').checked = settings.fCut; $('fIns').checked = settings.fIns;
$('fCut').onchange = e => { settings.fCut = e.target.checked; saveSettings(); renderEvents(); onFrame(); };
$('fIns').onchange = e => { settings.fIns = e.target.checked; saveSettings(); renderEvents(); onFrame(); };
$('rate').value = settings.rate;
$('rate').onchange = e => { settings.rate = e.target.value; video.playbackRate = +e.target.value; saveSettings(); };
function applyMute(){ video.muted = settings.muted; $('mute').textContent = settings.muted ? '🔇' : '🔊'; }
applyMute();
$('mute').onclick = () => { settings.muted = !settings.muted; applyMute(); saveSettings(); };
$('snap').onclick = snapshot;
function snapshot(){
  if (!A || !video.videoWidth) return;
  const c = document.createElement('canvas'); c.width = video.videoWidth; c.height = video.videoHeight;
  c.getContext('2d').drawImage(video, 0, 0);
  c.toBlob(b => {
    const a = document.createElement('a'); a.href = URL.createObjectURL(b);
    a.download = `${(A.title || 'frame').replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40)}_f${cur}.png`;
    a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 2000);
  });
}

addEventListener('keydown', e => {
  const tag = (e.target.tagName || '').toLowerCase();
  if (tag === 'input' && e.target.type === 'text') return;
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const step = e.shiftKey ? 10 : 1;
  switch (e.key) {
    case ' ': e.preventDefault(); togglePlay(); break;
    case 'ArrowLeft': case ',': e.preventDefault(); pause(); seekFrame(cur - step); break;
    case 'ArrowRight': case '.': e.preventDefault(); pause(); seekFrame(cur + step); break;
    case 'b': case 'B': jumpEvent(-1); break;
    case 'n': case 'N': jumpEvent(1); break;
    case 'Home': pause(); seekFrame(0); break;
    case 'End': if (A) { pause(); seekFrame(A.n - 1); } break;
    case 'm': case 'M': $('mute').click(); break;
    case 's': case 'S': snapshot(); break;
    case 'h': case 'H': document.body.classList.toggle('full'); drawAll(); break;
  }
});

// 붙여넣기 / 드래그앤드롭
addEventListener('paste', e => {
  if (e.target === $('url')) { setTimeout(() => { if (/^https?:\/\//.test($('url').value.trim())) analyzeUrl($('url').value); }, 0); return; }
  const f = [...(e.clipboardData.files || [])].find(f => f.type.startsWith('video/'));
  if (f) { analyzeFile(f); return; }
  const t = (e.clipboardData.getData('text') || '').trim();
  if (/^https?:\/\//.test(t)) analyzeUrl(t);
});
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (f) return analyzeFile(f);
  const t = (e.dataTransfer.getData('text/uri-list') || e.dataTransfer.getData('text') || '').split('\n')[0].trim();
  if (/^https?:\/\//.test(t)) analyzeUrl(t);
});

renderRecent();
drawAll();
// ?url=... 로 열면 바로 분석
const qp = new URLSearchParams(location.search).get('url');
if (qp) analyzeUrl(qp);
</script>
</body>
