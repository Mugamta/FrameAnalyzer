<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>프레임 분석기</title>
<style>
:root{--bg:#0f0f12;--panel:#18181d;--line:#2a2a33;--fg:#ddd;--muted:#8a8a96;--bar:#5a6274;--cut:#f6a447;--ins:#ff4f8b;--head:#fff;--thr:#e5484d}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--fg);font:13px system-ui,"Malgun Gothic",sans-serif;overflow:hidden}
body{display:flex;flex-direction:column}
button,select,input{font:inherit;color:var(--fg)}
button{background:#2a2a33;border:1px solid #393945;border-radius:4px;padding:4px 10px;cursor:pointer;white-space:nowrap}
button:hover{background:#34343f}
button.primary{background:#7a4512;border-color:var(--cut);color:#fff}
select{background:#22222a;border:1px solid #393945;border-radius:4px;padding:3px 4px}
input[type=range]{width:120px;accent-color:var(--cut)}
label{display:flex;gap:5px;align-items:center;color:var(--muted)}
label b{color:var(--fg);font-weight:normal;font-variant-numeric:tabular-nums}
.sep{width:1px;height:20px;background:var(--line)}
#top{display:flex;gap:10px;align-items:center;padding:6px 10px;background:var(--panel);border-bottom:1px solid var(--line)}
#title{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#note{color:var(--muted);font-size:12px;white-space:nowrap}
#note.warn{color:#ffb86b}
#main{flex:1;min-height:0;display:flex}
#stage{flex:1;min-width:0;background:#000;position:relative;display:flex;align-items:center;justify-content:center}
#video{width:100%;height:100%;object-fit:contain;display:block}
#drop{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:16px;text-align:center;padding:20px}
#drop.hidden{display:none}
#drop small{font-size:12px;line-height:1.7}
#dragover{position:absolute;inset:0;border:3px dashed var(--cut);background:rgba(246,164,71,.08);display:none;align-items:center;justify-content:center;font-size:20px;pointer-events:none;z-index:5}
body.dragging #dragover{display:flex}
#busy{position:absolute;inset:0;background:rgba(0,0,0,.72);display:none;flex-direction:column;align-items:center;justify-content:center;gap:12px;z-index:4;padding:20px;text-align:center}
#busy.show{display:flex}
#busy .msg{font-size:15px;white-space:pre-wrap;max-width:720px}
#busy .msg.err{color:#ff8b8e;font-size:13px}
#busy .bar{width:min(420px,80%);height:6px;background:#2a2a33;border-radius:3px;overflow:hidden}
#busy .bar i{display:block;height:100%;width:0;background:var(--cut)}
#badge{position:absolute;left:10px;top:10px;background:rgba(0,0,0,.65);padding:4px 8px;border-radius:4px;font-variant-numeric:tabular-nums;pointer-events:none;display:none}
#badge.ins{background:rgba(255,79,139,.85);color:#fff}
#badge.cut{background:rgba(246,164,71,.85);color:#111}
#side{width:300px;background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column}
#side h3{margin:0;padding:8px 10px;font-size:13px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-weight:normal}
#side h3 b{color:var(--fg);font-weight:normal}
#filters{display:flex;gap:10px;padding:6px 10px;border-bottom:1px solid var(--line)}
#events{list-style:none;margin:0;padding:0;overflow:auto;flex:1}
#events li{padding:6px 8px;cursor:pointer;border-bottom:1px solid #202027;border-left:3px solid transparent}
#events li:hover{background:#22222a}
#events li.cur{background:#2c2418}
#events li.cut{border-left-color:var(--cut)}
#events li.ins{border-left-color:var(--ins)}
#events .hd{display:flex;gap:6px;align-items:baseline;margin-bottom:4px;font-variant-numeric:tabular-nums}
#events .hd .k{font-weight:600}
#events li.cut .k{color:var(--cut)}
#events li.ins .k{color:var(--ins)}
#events .hd .t{color:var(--muted);margin-left:auto;font-size:12px}
#events .th{display:flex;gap:3px;align-items:center}
#events .th canvas{flex:1 1 0;min-width:0;max-width:120px;height:64px;object-fit:contain;background:#000;border-radius:2px}
#events .th canvas.mid{outline:2px solid var(--ins)}
#events .th .ar{color:var(--muted);font-size:11px}
#events .empty{padding:14px 10px;color:var(--muted);cursor:default;line-height:1.6}
#panel{background:var(--panel);border-top:1px solid var(--line);padding:6px 10px 8px;display:flex;flex-direction:column;gap:6px}
#strip{display:flex;gap:4px;justify-content:center;height:78px}
#strip .f{display:flex;flex-direction:column;align-items:center;gap:2px;cursor:pointer;font-size:11px;color:var(--muted);font-variant-numeric:tabular-nums;min-width:0}
#strip canvas{height:62px;max-width:100%;object-fit:contain;background:#000;border-radius:3px;border:2px solid transparent}
#strip .f.cur canvas{border-color:#fff}
#strip .f.cur{color:#fff}
#strip .f.cut canvas{border-color:var(--cut)}
#strip .f.ins canvas{border-color:var(--ins)}
#strip .f.cur.cut canvas,#strip .f.cur.ins canvas{box-shadow:0 0 0 2px #fff}
canvas.graph{width:100%;display:block;border-radius:4px;touch-action:none}
#detail{height:110px;cursor:crosshair}
#overview{height:40px;cursor:pointer}
.row{display:flex;flex-wrap:wrap;gap:6px 10px;align-items:center}
#time{font-variant-numeric:tabular-nums;min-width:240px}
.help{color:var(--muted);font-size:12px;margin-left:auto}
kbd{background:#2a2a33;border:1px solid #393945;border-radius:3px;padding:0 4px;font:11px Consolas,monospace}
body.full #side,body.full #panel,body.full #top{display:none}
@media (max-width:760px){
  #main{flex-direction:column}
  #side{width:auto;height:34%;border-left:none;border-top:1px solid var(--line)}
  .help,#strip{display:none}
  #time{min-width:0}
}
</style>
</head>
<body>
<div id="top">
  <button id="open" class="primary">파일 열기</button>
  <input id="file" type="file" accept="video/*,.mkv,.mov,.webm,.mp4,.m4v" hidden>
  <div id="title"></div>
  <span id="note"></span>
</div>
<div id="main">
  <div id="stage">
    <video id="video" playsinline preload="auto"></video>
    <div id="badge"></div>
    <div id="drop">
      <div>영상 파일을 여기에 드래그앤드롭하세요</div>
      <small>모든 프레임을 하나씩 디코딩해서 이전 프레임과 크게 달라지는 지점(장면 전환)과<br>
      잠깐 끼워 넣은 컷(1~3프레임)을 찾아냅니다.<br>
      파일은 이 브라우저 안에서만 처리되며 어디에도 업로드되지 않습니다.</small>
    </div>
    <div id="busy"><div class="msg"></div><div class="bar"><i></i></div><button id="busyClose" hidden>닫기</button></div>
    <div id="dragover">여기에 놓기</div>
  </div>
  <div id="side">
    <h3><span>감지된 지점 <b id="evCount">0</b></span><button id="exportBtn" title="목록을 텍스트로 복사">복사</button></h3>
    <div id="filters">
      <label><input type="checkbox" id="fCut" checked> <span style="color:var(--cut)">장면 전환</span></label>
      <label><input type="checkbox" id="fIns" checked> <span style="color:var(--ins)">숨은 컷</span></label>
    </div>
    <ul id="events"><li class="empty">아직 분석한 영상이 없습니다.</li></ul>
  </div>
</div>
<div id="panel">
  <div id="strip"></div>
  <canvas id="detail" class="graph"></canvas>
  <canvas id="overview" class="graph"></canvas>
  <div class="row">
    <button id="play" title="재생/정지 (Space)">▶</button>
    <button id="prevF" title="1프레임 뒤로 (← 또는 ,)">◀ 1f</button>
    <button id="nextF" title="1프레임 앞으로 (→ 또는 .)">1f ▶</button>
    <button id="prevE" title="이전 감지 지점 (B)">⏮ 이전 지점</button>
    <button id="nextE" title="다음 감지 지점 (N)">다음 지점 ⏭</button>
    <span id="time">-</span>
    <div class="sep"></div>
    <label title="높을수록 작은 변화도 잡습니다">민감도 <input type="range" id="sens" min="1" max="10" step="1" value="5"> <b id="sensV">5</b></label>
    <label>속도 <select id="rate"><option>0.1</option><option>0.25</option><option>0.5</option><option selected>1</option><option>2</option></select></label>
    <button id="mute" title="음소거 (M)">🔇</button>
    <button id="snap" title="현재 프레임을 PNG로 저장 (S)">프레임 저장</button>
    <span class="help"><kbd>←</kbd><kbd>→</kbd> 프레임 · <kbd>Shift</kbd>+화살표 10프레임 · <kbd>B</kbd><kbd>N</kbd> 지점 이동 · <kbd>H</kbd> 전체화면</span>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/mp4box@0.5.2/dist/mp4box.all.min.js"></script>
<script>
'use strict';
const $ = id => document.getElementById(id);
const video = $('video');
const LS_KEY = 'frameAnalyzer.v1';
const settings = Object.assign({sens: 5, fCut: true, fIns: true, rate: '1', muted: true}, loadSettings());
function loadSettings(){ try { return JSON.parse(localStorage.getItem(LS_KEY)) || {}; } catch { return {}; } }
function saveSettings(){ try { localStorage.setItem(LS_KEY, JSON.stringify(settings)); } catch {} }

let A = null;          // 분석 결과 {n, fps, duration, pts, d, h, s1, s2, s3}
let score = null;      // 프레임별 변화 점수 (0~1)
let maxScore = 0.1;
let events = [];       // {type:'cut'|'ins', at, len, score}
let eventOf = null;    // 프레임 → 이벤트 index (-1 없음)
let endOf = null;      // 숨은 컷이 끝나고 원래 장면으로 돌아오는 프레임 → 이벤트 index
let cur = 0;           // 현재 프레임
let view = {start: 0, len: 150, follow: true};
let jobToken = 0;
let objectUrl = null;
const CANCEL = Symbol('cancel');

// ------------------------------------------------------------ 오버레이
function showBusy(msg, prog, isErr){
  const b = $('busy');
  b.classList.add('show');
  const m = b.querySelector('.msg');
  m.textContent = msg;
  m.classList.toggle('err', !!isErr);
  b.querySelector('.bar').style.display = isErr ? 'none' : '';
  b.querySelector('.bar i').style.width = Math.round((prog || 0) * 100) + '%';
  $('busyClose').hidden = !isErr;
}
function hideBusy(){ $('busy').classList.remove('show'); }
$('busyClose').onclick = hideBusy;

// ------------------------------------------------------------ 프레임 분석
// 프레임마다 64x64로 줄여서 아래 값을 계산한다.
//   d[i]  : 프레임 i-1 → i 평균 픽셀 차이 (0~1)
//   h[i]  : 프레임 i-1 → i 색 히스토그램 차이 (0~1, 카메라 움직임에 둔감)
//   sK[i] : 프레임 i-1 → i+K 픽셀 차이 (K=1~3, 끼워 넣은 프레임을 건너뛴 비교)
// 짧게 끼워 넣은 컷은 d가 크지만 sK는 작다.
const SMALL = 64;
function makeAccumulator(){
  const N = SMALL * SMALL;
  let cv, ctx;
  if (typeof OffscreenCanvas !== 'undefined') cv = new OffscreenCanvas(SMALL, SMALL);
  else { cv = document.createElement('canvas'); cv.width = cv.height = SMALL; }
  ctx = cv.getContext('2d', {willReadFrequently: true});
  const ring = [];           // 최근 4프레임
  let prevHist = null;
  const pts = [], d = [], h = [], s = [[], [], [], []];
  const diff = (a, b) => {
    let sum = 0;
    for (let i = 0; i < a.length; i += 4)
      sum += Math.abs(a[i] - b[i]) + Math.abs(a[i + 1] - b[i + 1]) + Math.abs(a[i + 2] - b[i + 2]);
    return sum / (N * 3 * 255);
  };
  return {
    get count(){ return pts.length; },
    push(src, t){
      ctx.drawImage(src, 0, 0, SMALL, SMALL);
      const px = ctx.getImageData(0, 0, SMALL, SMALL).data;
      const hist = new Uint32Array(48);
      for (let i = 0; i < px.length; i += 4) { hist[px[i] >> 4]++; hist[16 + (px[i + 1] >> 4)]++; hist[32 + (px[i + 2] >> 4)]++; }
      const j = pts.length;
      pts.push(t);
      if (j) {
        d.push(diff(px, ring[ring.length - 1]));
        let hs = 0; for (let k = 0; k < 48; k++) hs += Math.abs(hist[k] - prevHist[k]);
        h.push(hs / (N * 6));
      } else { d.push(0); h.push(0); }
      for (let k = 1; k <= 3; k++) {
        s[k].push(-1);
        if (j - 1 - k >= 0) s[k][j - k] = diff(px, ring[ring.length - 1 - k]);
      }
      ring.push(px); if (ring.length > 4) ring.shift();
      prevHist = hist;
    },
    result(){
      const n = pts.length;
      const iv = []; for (let i = 1; i < n; i++) if (pts[i] > pts[i - 1]) iv.push(pts[i] - pts[i - 1]);
      iv.sort((a, b) => a - b);
      const med = iv.length ? iv[iv.length >> 1] : 1 / 30;
      const fps = Math.round(1000 / med) / 1000;
      return {n, fps, duration: n ? pts[n - 1] + med : 0, pts, d, h, s1: s[1], s2: s[2], s3: s[3]};
    },
  };
}

// 방법 1: mp4/mov → mp4box.js로 분해 + WebCodecs로 모든 프레임 디코딩 (빠르고 정확)
function editListOffset(trak, movieTimescale, trackTimescale){
  const ents = trak.edts && trak.edts.elst && trak.edts.elst.entries;
  if (!ents || !ents.length) return 0;
  let empty = 0;
  for (const e of ents) {
    if (e.media_time === -1) { empty += e.segment_duration / movieTimescale; continue; }
    return e.media_time / trackTimescale - empty;
  }
  return 0;
}
function codecDescription(trak){
  for (const entry of trak.mdia.minf.stbl.stsd.entries) {
    const box = entry.avcC || entry.hvcC;
    if (box) {
      const st = new DataStream(undefined, 0, DataStream.BIG_ENDIAN);
      box.write(st);
      return new Uint8Array(st.buffer, 8);   // 박스 헤더 8바이트 제외
    }
  }
  return undefined;
}
async function analyzeWebCodecs(file, token, onProgress){
  if (!('VideoDecoder' in window) || !window.MP4Box) throw new Error('WebCodecs 미지원');
  const mp4 = MP4Box.createFile();
  const acc = makeAccumulator();
  let track = null, decoder = null, ptsOff = 0, failed = null;
  const queue = [];
  mp4.onError = e => { failed = new Error('mp4 해석 실패: ' + e); };
  mp4.onReady = info => {
    track = info.videoTracks[0];
    if (!track) { failed = new Error('비디오 트랙이 없습니다.'); return; }
    const trak = mp4.getTrackById(track.id);
    ptsOff = editListOffset(trak, info.timescale, track.timescale);
    const codec = track.codec.startsWith('vp08') ? 'vp8' : track.codec;
    const config = {codec, codedWidth: track.video.width, codedHeight: track.video.height};
    const desc = codecDescription(trak);
    if (desc) config.description = desc;
    decoder = new VideoDecoder({
      output: frame => {
        if (token === jobToken) {
          const t = frame.timestamp / 1e6 - ptsOff;
          if (t > -1e-4) acc.push(frame, Math.max(0, t));   // 편집 목록으로 잘린 앞부분은 버림
        }
        frame.close();
      },
      error: e => { failed = e; },
    });
    decoder.configure(config);
    mp4.setExtractionOptions(track.id, null, {nbSamples: 100});
    mp4.start();
  };
  mp4.onSamples = (id, user, samples) => { for (const s of samples) queue.push(s); };

  const check = () => { if (token !== jobToken) throw CANCEL; if (failed) throw failed; };
  const report = () => {
    if (track && track.nb_samples) onProgress(acc.count / track.nb_samples, `프레임 분석 중 ${acc.count} / ${track.nb_samples}`);
  };
  const pump = async () => {
    while (queue.length) {
      check();
      if (decoder.decodeQueueSize > 30) {
        await new Promise(r => { decoder.addEventListener('dequeue', r, {once: true}); setTimeout(r, 50); });
        report();
        continue;
      }
      const s = queue.shift();
      decoder.decode(new EncodedVideoChunk({
        type: s.is_sync ? 'key' : 'delta',
        timestamp: 1e6 * s.cts / s.timescale,
        duration: 1e6 * s.duration / s.timescale,
        data: s.data,
      }));
      mp4.releaseUsedSamples(track.id, s.number + 1);
    }
  };

  const CHUNK = 4 << 20;
  for (let off = 0; off < file.size; off += CHUNK) {
    check();
    const buf = await file.slice(off, off + CHUNK).arrayBuffer();
    buf.fileStart = off;
    mp4.appendBuffer(buf);
    check();
    if (decoder) { await pump(); report(); }
    else onProgress(0, `파일 읽는 중 ${Math.round(off / file.size * 100)}%`);
  }
  mp4.flush();
  check();
  if (!decoder) throw new Error('mp4 형식이 아니거나 영상 정보를 찾지 못했습니다.');
  await pump();
  await decoder.flush();
  check();
  decoder.close();
  if (!acc.count) throw new Error('디코딩된 프레임이 없습니다.');
  return acc.result();
}

// 방법 2: 그 외 형식(webm 등) → 실제로 재생하면서 화면에 나온 프레임을 하나씩 분석 (실시간 속도)
function analyzePlayback(url, token, onProgress){
  return new Promise((resolve, reject) => {
    const v = document.createElement('video');
    if (!v.requestVideoFrameCallback) return reject(new Error('이 브라우저는 프레임 단위 분석을 지원하지 않습니다. Chrome이나 Edge를 사용하세요.'));
    v.muted = true; v.playsInline = true; v.preload = 'auto';
    v.style.cssText = 'position:fixed;left:0;top:0;width:2px;height:2px;opacity:0;pointer-events:none';
    document.body.appendChild(v);
    const acc = makeAccumulator();
    let lastPresented = -1, dropped = 0, lastMedia = -1;
    const cleanup = () => { v.pause(); v.removeAttribute('src'); v.load(); v.remove(); };
    const cb = (now, meta) => {
      if (token !== jobToken) { cleanup(); return reject(CANCEL); }
      if (lastPresented >= 0 && meta.presentedFrames - lastPresented > 1) dropped += meta.presentedFrames - lastPresented - 1;
      lastPresented = meta.presentedFrames;
      if (meta.mediaTime > lastMedia + 1e-6) { acc.push(v, meta.mediaTime); lastMedia = meta.mediaTime; }
      onProgress(v.duration ? meta.mediaTime / v.duration : 0, `재생하며 분석 중 ${acc.count}프레임 (실시간 속도)`);
      v.requestVideoFrameCallback(cb);
    };
    v.onended = () => {
      const r = acc.result(); r.dropped = dropped; cleanup();
      r.n ? resolve(r) : reject(new Error('분석된 프레임이 없습니다.'));
    };
    v.onerror = () => { cleanup(); reject(new Error('브라우저가 이 영상을 재생하지 못합니다. (지원하지 않는 코덱/형식)')); };
    v.onloadedmetadata = () => { v.requestVideoFrameCallback(cb); v.play().catch(e => { cleanup(); reject(e); }); };
    v.src = url;
  });
}

async function analyzeFile(file){
  if (!file) return;
  const token = ++jobToken;
  pause();
  if (objectUrl) URL.revokeObjectURL(objectUrl);
  objectUrl = URL.createObjectURL(file);
  const url = objectUrl;
  const t0 = performance.now();
  const onProgress = (p, msg) => { if (token === jobToken) showBusy(`${file.name}\n${msg}`, p); };
  onProgress(0, '여는 중…');
  let res, method = 'webcodecs';
  try {
    res = await analyzeWebCodecs(file, token, onProgress);
  } catch (e) {
    if (e === CANCEL) return;
    console.warn('WebCodecs 분석 실패, 재생 방식으로 전환:', e);
    method = 'playback';
    try { res = await analyzePlayback(url, token, onProgress); }
    catch (e2) {
      if (e2 === CANCEL) return;
      showBusy(`분석 실패 — ${file.name}\n\n${e2.message || e2}`, 0, true);
      return;
    }
  }
  if (token !== jobToken) return;
  res.title = file.name;
  res.video = url;
  res.method = method;
  res.elapsed = (performance.now() - t0) / 1000;
  hideBusy();
  load(res);
}

function load(res){
  A = res;
  A.pts = Float64Array.from(A.pts);
  for (const k of ['d', 'h', 's1', 's2', 's3']) A[k] = Float32Array.from(A[k]);
  score = new Float32Array(A.n);
  for (let i = 0; i < A.n; i++) score[i] = (A.d[i] + A.h[i]) / 2;

// ------------------------------------------------------------ 썸네일 (숨겨진 두 번째 video)
const thumbVideo = document.createElement('video');

const thumbQueue = [];

    case 'n': case 'N': jumpEvent(1); break;
    case 'Home': pause(); seekFrame(0); break;
    case 'End': if (A) { pause(); seekFrame(A.n - 1); } break;
    case 'm': case 'M': $('mute').click(); break;
    case 's': case 'S': snapshot(); break;
    case 'h': case 'H': document.body.classList.toggle('full'); drawAll(); break;
  }
});

// 붙여넣기 / 드래그앤드롭
addEventListener('paste', e => {
  const f = [...(e.clipboardData.files || [])].find(f => f.type.startsWith('video/'));
  if (f) analyzeFile(f);
});
let dragDepth = 0;
addEventListener('dragenter', e => { e.preventDefault(); dragDepth++; document.body.classList.add('dragging'); });
addEventListener('dragleave', () => { if (--dragDepth <= 0) { dragDepth = 0; document.body.classList.remove('dragging'); } });
addEventListener('dragover', e => e.preventDefault());
addEventListener('drop', e => {
  e.preventDefault(); dragDepth = 0; document.body.classList.remove('dragging');
  const f = e.dataTransfer.files[0];
  if (f) analyzeFile(f);
});

drawAll();
</script>
</body>
</html>
